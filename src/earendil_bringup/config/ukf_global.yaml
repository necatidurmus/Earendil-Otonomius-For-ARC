# UKF Global — GPS + local odometry fusion
# Fuses: local odometry + GPS (from navsat_transform) → global odometry
# world_frame: map (RTK-referenced)
# Input: /odometry/local (from ukf_local), /odometry/gps (from navsat)
# Output: /odometry/global (remapped in launch), map → odom TF

ukf_global_node:
  ros__parameters:
    use_sim_time: false
    frequency: 10.0
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Local odometry (from ukf_local, remapped via launch)
    odom0: /odometry/local
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: true
    odom0_relative: false
    odom0_queue_size: 10

    # GPS odometry (from navsat_transform)
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
    odom1_rejection_threshold: 5.0

    process_noise_covariance: [
