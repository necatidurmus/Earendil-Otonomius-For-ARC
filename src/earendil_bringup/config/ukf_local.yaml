# UKF Local — Odom-level sensor fusion
# Fuses: STM wheel odometry + STM IMU → smooth local odometry
# world_frame: odom (no GPS jumps)
# Input: /stm/wheel_odom, /stm/imu/data
# Output: /odometry/local (remapped in launch), odom → base_link TF

ukf_local_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # STM wheel odometry
    odom0: /stm/wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # STM IMU (MPU9250)
    imu0: /stm/imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

    process_noise_covariance: [
