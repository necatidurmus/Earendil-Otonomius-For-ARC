services:
  earendil-arc:
    build: .
    image: earendil-arc:humble
    container_name: earendil-arc
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=42
    volumes:
      - .:/home/ros/ws/src/earendil
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true
